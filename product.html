<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produto – Rick And Morty</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="favicon-64.png">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<script src="data.js"></script>
<script src="main.js"></script>
<script>document.addEventListener("DOMContentLoaded", ()=>{ initCommon("shop"); loadProduct(); });</script>

<section class="section"><div class="container" id="detail"></div></section>

<script>
function loadProduct(){
  const id = new URLSearchParams(location.search).get("id");
  const p = window.PRODUCTS.find(x=>x.id===id) || window.PRODUCTS[0];
  document.title = p.name + " – Rick And Morty";
  document.getElementById("detail").innerHTML = `
    <div class="detail">
      <div class="img"><img src="${p.img}" alt="${p.name}"></div>
      <div>
        <h1>${p.name}</h1>
        <p class="tag">${p.tag}</p>
        <div class="rating">${stars(p.rating)} (${p.reviews} avaliações)</div>
        <p class="desc">${p.desc}</p>
        <div class="price">${p.btc} <span>/ ${p.eth}</span></div>
        <div class="actions">
          <button class="btn" onclick="addToCart('${p.id}'); alert('Adicionado ao carrinho (fictício).')">Adicionar ao Carrinho</button>
          <a class="btn outline" href="shop.html">Voltar à Loja</a>
        </div>
      </div>
    </div>`;
  if(window.lucide) lucide.createIcons();
}
</script>
</body>
</html>
