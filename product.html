<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Produto — Rick And Morty</title>
<script>
(function () {
  var id = new URLSearchParams(location.search).get("id") || "";
  var ok = /^[a-z0-9-]+$/i.test(id);
  location.replace(ok ? "/produto/" + id + "/" : "/loja/");
})();
</script>
</head>
<body>
<p>Redirecionando para <a href="/loja/">a loja</a>.</p>
</body>
</html>
