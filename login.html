<script>document.addEventListener("DOMContentLoaded", ()=>{ initCommon("login"); });</script>

<div class="login-box">
  <h1>ENTRAR</h1>
  <p>Acesse sua conta Rick And Morty.</p>
  <input type="text" placeholder="Usuário" id="u">
  <input type="password" placeholder="Senha" id="p">
  <button onclick="doLogin()">Entrar</button>
  <p style="margin-top:14px;font-size:12px;opacity:.5;">Acesse sua conta.</p>
</div>

<script>
function doLogin(){
  const u = document.getElementById("u").value;
  alert("Bem-vindo de volta, " + (u||"convidado") + "!");
}
</script>
