<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja – Rick And Morty</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon-512.png" type="image/png" sizes="512x512">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0a">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<script src="data.js"></script>
<script src="main.js"></script>
<script>document.addEventListener("DOMContentLoaded", ()=>{ initCommon("shop"); });</script>

<section class="section"><div class="container">
  <h2>NOSSOS PRODUTOS</h2>
  <p class="lead">Pílulas premium para toda ocasião. Produzidas com precisão e entregues com discrição.</p>
  <div class="filter-bar">
    <button class="filter-btn active" data-cat="all" onclick="filterCat('all',this)">Tudo</button>
    <button class="filter-btn" data-cat="Alívio da Dor" onclick="filterCat('Alívio da Dor',this)">Alívio da Dor</button>
    <button class="filter-btn" data-cat="Auxílio ao Sono" onclick="filterCat('Auxílio ao Sono',this)">Auxílio ao Sono</button>
    <button class="filter-btn" data-cat="Energia" onclick="filterCat('Energia',this)">Energia</button>
  </div>
  <div class="product-grid" id="grid"></div>
</section>

<script>
function filterCat(cat, btn){
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  if(btn) btn.classList.add("active");
  const list = cat==='all'? window.PRODUCTS : window.PRODUCTS.filter(p=>p.category===cat);
  document.getElementById("grid").innerHTML = list.map(p=>`
    <div class="product-card">
      <div class="img"><img src="${p.img}" alt="${p.name}"></div>
      <div class="body">
        <h3 class="name">${p.name}</h3>
        <p class="tag">${p.tag}</p>
        <div class="rating">${stars(p.rating)} (${p.reviews})</div>
        <div class="price">${p.btc} <span>/ ${p.eth}</span></div>
        <a class="btn" href="product.html?id=${p.id}">Ver Detalhes</a>
      </div>
    </div>`).join("");
  if(window.lucide) lucide.createIcons();
}
document.addEventListener("DOMContentLoaded", ()=>filterCat("all"));
</script>
</body>
</html>
